<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caixa de Seleção</title>
  </head>
  <body>
    <h1>Caixa de Seleção</h1>
    <p>
      Caixas de seleção permitem que o usuário selecione ZERO ou MAIS opções de
      um número limitado de opções.
    </p>

    <form action="#">
      <p>
        <input
          type="checkbox"
          id="bicicleta"
          name="bicicleta"
          value="bicicleta"
        />
        <label for="bibicleta">Eu tenho uma bibicleta</label>
      </p>
      <p>
        <input type="checkbox" id="carro" name="carro" value="carro" />
        <label for="carro">Eu tenho um carro</label>
      </p>
      <p>
        <input type="checkbox" id="barco" name="barco" value="barco" />
        <label for="barco">Eu tenho um barco</label>
      </p>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
