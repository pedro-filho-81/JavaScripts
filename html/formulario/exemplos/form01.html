<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1º Formulário</title>
  </head>
  <body>
    <h1>Campos de entrada de texto</h1>
    <form action="#">
      <p>
        <label for="nome">Primeiro Nome</label><br />
        <input type="text" id="inNome" name="nome" value="Pedro" />
      </p>
      <p>
        <label for="sobrenome">Sobrenome</label><br />
        <input type="text" id="inSobrenome" name="sobrenome" value="Filho" />
      </p>
      <button type="submit">Enviar</button>
    </form>

    <p>Note que a forma em si não é visível .</p>

    <p>
      Também note que a largura padrão dos campos de entrada de texto é de 20
      caracteres.
    </p>
  </body>
</html>
