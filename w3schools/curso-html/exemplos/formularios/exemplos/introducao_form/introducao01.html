<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01-Primeiro Formulário Html</title>
  </head>
  <body>
    <h1>01-Introdução Formulário Html</h1>
    <h2>Formulários HTML</h2>

    <p>
      Um formulário HTML é usado para coletar a entrada do usuário. A entrada do
      usuário é na maioria das vezes enviadas para um servidor para
      processamento.
    </p>

    <form action="./action.php">
      <p>
        Nome: <input type="text" id="inNome" name="inNome" required autofocus />
      </p>
      <p>
        <label for="#">Sobrenome: </label>
        <input type="text" id="inSobrenome" name="inSobrenome" required / >
      </p>
      <p>
        <input type="submit" value="Enviar" />
      </p>
    </form>
  </body>
</html>
