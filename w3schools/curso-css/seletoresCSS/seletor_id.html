<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seletor (ID Html) CSS</title>
    <!-- Inclui CSS na página Html -->
    <!-- Estilizando o párágrafo CSS -->
    <style>
      /* SELETOR DE ELEmENTOS CSS /
      É O NOmE DA TAG (ELEmENTO)
      HTmL TODAS AS TAGs (p)
      DO HTmL FICARÃO VERmELHAS
      ALINHADAS AO CENTRO*/
      p#para {
        color: red;
        text-align: center;
        font-size: 25px;
      }
      p {
        color: green;
        text-align: center;
        font-size: 35px;
      }
    </style>
  </head>
  <body>
    <h1>Seletor (ID HTmL) CSS</h1>
    <h2>Estilizando os parágrafos pela tag &lt;p id="para"&gt;</h2>
    <p>Cada parágrafo será influenciado pelo estilo</p>

    <p id="para">Eu serei estilizado pelo meu ID</p>

    <p>E eu não</p>
  </body>
</html>
