<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seletor tag CSS</title>
    <!-- Inclui CSS na página Html -->
    <!-- Estilizando a página com CSS -->
    <style>
      /* SELETOR DE ELEmENTOS CSS /
      É O NOmE DA TAG (ELEmENTO)
      HTmL TODAS AS TAGs (p)
      DO HTmL FICARÃO VERmELHAS
      ALINHADAS AO CENTRO*/
      p {
        color: red;
        text-align: center;
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <h1>Seletor (Tag Html) CSS</h1>
    <h2>Estilizando os parágrafos pela tag &lt; p &gt;</h2>
    <p>Cada parágrafo será influenciado pelo estilo</p>

    <p>Eu também serei</p>

    <p>E eu</p>
  </body>
</html>
