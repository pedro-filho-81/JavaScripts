<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>média das notas</title>
  </head>
  <body>
    <h1>média das notas</h1>
    <script>
      const nota1 = Number(prompt('1ª nota: '))
      const nota2 = Number(prompt('2ª nota: '))
      const soma = nota1 + nota2
      const media = soma / 2

      alert(`1ª nota: ${nota1}\n2ª nota: ${nota2}\n média: ${media}`)
    </script>
  </body>
</html>
