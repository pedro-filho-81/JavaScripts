<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipos de Variável</title>
  </head>
  <body>
    <h1>tipos de Variável</h1>
    <script>
      const fruta = 'Abacate' // string
      const preco = 3.55 // float
      const levar = true // booleano
      let novoValor

      // exibir os tipos das variáveis acima
      console.log(`fruta = 'Avacate' é do tipo: ${typeof fruta}`)
      console.log(`preco = 3.55 é do tipo: ${typeof preco}`)
      console.log(`levar = true é do tipo: ${typeof levar}`)
      console.log(`novoValor é do tipo: ${typeof novoValor}`)
      console.log(
        `verifica se o valor é inteiro:\nNumber.isInteger(12): \n${Number.isInteger(
          12
        )}`
      )
      console.log(
        `verifica se o valor é inteiro:\nNumber.isInteger(3.50): \n${Number.isInteger(
          3.5
        )}`
      )
    </script>
  </body>
</html>
