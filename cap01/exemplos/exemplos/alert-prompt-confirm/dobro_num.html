<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dobro do Número</title>
  </head>
  <body>
    <h1>Dobro do Número</h1>
    <script>
      /*
      a) Elaborar um programa que leia um número. Calcule e informe o dobro desse número.
    */
      // entrada dos dados
      const num = Number(prompt('Digite um número:'))
      // calcular o dobro
      const dobro = num * 2
      // exibe o dobro do número
      alert(`o dobro de ${num} é ${dobro}`)
    </script>
  </body>
</html>
