<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peso Ideal JS</title>
    <link rel="icon" href="/livro-algoritimos/cap04/exemplos/img/livrojs.png" />
    <!-- Adiciona o CSS -->
    <link rel="stylesheet" href="/livro-algoritimos/css/style.css" />
  </head>
  <body>
    <div id="container">
      <h1>Programa Cálculo do Peso Ideal JS</h1>
      <pre>
      Vamos construir um novo exemplo para explorar o uso 
      dos operadores lógicos na construção do script.
      O nosso programa vai calcular o peso ideal de uma pessoa.
      </pre>

      <h2>Peso Ideal</h2>

      <form>
        <p>
          <label for="inNome">Nome:</label> <br />
          <input type="text" id="inNome" name="nome" required />
        </p>

        <p id="sexo">
          Sexo:
          <input type="radio" name="sexo" id="inMasculino" />Mascuino
          <input type="radio" name="sexo" id="inFeminino" />Feminino
        </p>

        <p>
          <label for="altuara">Altura</label> <br />
          <input
            type="number"
            id="inAltura"
            name="altura"
            min="0"
            step="0.01"
            required
          />
        </p>
        <p>
          <input type="submit" value="Calcular Peso Ideal" />
          <input type="reset" value="Limpar Campos" />
        </p>
      </form>

      <div id="resposta">
        <h2 id="outResp1"></h2>
        <h2 id="outResp2"></h2>
      </div>
    </div>

    <!-- Adiciona o JavaScript -->
    <script src="/livro-algoritimos/cap04/exemplos/peso-ideal/peso_ideal.js"></script>
  </body>
</html>
