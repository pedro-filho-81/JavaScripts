<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soma 2 Números JS</title>
    <link rel="stylesheet" href="/livro-algoritimos/css/style.css" />
  </head>
  <body>
    <div id="container">
      <h1>Soma 2 Números JS</h1>
      <pre>
      Criar um programa com duas variáveis n1 e n2, 
      que recebe dois números do usuário, 
      cria a variável soma que soma os dois números, 
      após exibe a soma.
      </pre>

      <h2>Somar dois números</h2>

      <form>
        <p>
          1º Número: <br />
          <input type="number" id="inNumero1" name="numero1" min="0" required />
        </p>
        <p>
          2º Número: <br />
          <input type="number" id="inNumero2" name="numero2" min="0" required />
        </p>
        <p>
          <input type="submit" value="Somar os Números" />
        </p>
      </form>

      <h2 id="outResp1"></h2>
    </div>
    <script src="soma_numeros.js"></script>
  </body>
</html>
