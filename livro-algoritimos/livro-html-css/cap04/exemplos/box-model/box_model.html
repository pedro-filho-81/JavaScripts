<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box model</title>
    <!-- CSS -->
    <style>
      html {
        box-sizing: border-box;
      }
      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-size: 20px;
      }
      h1 {
        margin-left: 40px;
      }
      p {
        width: 400px;
        text-align: justify;
        background: #f6f6f6;
        margin: 20px 80px 100px 40px;
        border: solid #ccc;
        border-width: 10px 30px 50px 15px;
        padding: 35px 50px 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>Box model</h1>
    <p>
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Cupiditate
      undeerror eligendi, laboriosam veritatis earum aspernatur ducimus natus
      ratione officiis, voluptates est repellendus commodi sunt perferendis
      magnam eveniet, deleniti voluptatibus.
    </p>
  </body>
</html>
