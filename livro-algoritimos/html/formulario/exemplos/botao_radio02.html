<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botões de Rádio</title>
  </head>

  <body>
    <h1>Botões de Rádio</h1>
    <p>
      Botões de acesso permitem que o usuário selecione UMA entre um número
      limitado de opções.
    </p>

    <!-- cria o formulário -->
    <h2>Escolha a sua linguagem favorita:</h2>

    <form action="#">
      <p>
        <input type="radio" id="html" value="HTmL" name="fav_language" />
        <label for="html">Html</label>
      </p>
      <p>
        <input type="radio" id="css" value="Css" name="fav_language" />
        <label for="css">Css</label>
      </p>
      <p>
        <input
          type="radio"
          id="javascript"
          value="JavaScript"
          name="fav_language"
        />
        <label for="javascript">JavaScript</label>
      </p>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
