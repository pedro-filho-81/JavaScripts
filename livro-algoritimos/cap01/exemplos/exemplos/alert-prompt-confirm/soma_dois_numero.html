<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Soma dois números</h1>
    <script>
      /*
        b) Elaborar um programa que leia dois números. 
        Calcule e informe a soma desses números. 
        • Entrada de dados: ler dois números 
        • Processamento: calcular a soma 
        • Saída: informar a soma
        
        Iepsen, Edécio Fernando. Lógica de Programação e Algoritmos com JavaScript - 2ª Edição: Uma introdução à programação de computadores com exemplos e exercícios para iniciantes (Portuguese Edition) (p. 47). Novatec Editora. Edição do Kindle. 
    */

      const n1 = Number(prompt('Digite um número: '))
      const n2 = Number(prompt('Digite outro número: '))
      const soma = n1 + n2
      alert(`A som entre ${n1} e ${n2} é ${soma}`)
    </script>
  </body>
</html>
