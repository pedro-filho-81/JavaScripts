<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duração da Viagem</title>
  </head>
  <body>
    <h1>Duração da Viagem</h1>
    <script>
      /*
        d) Elaborar um programa que leia a duração de uma
        viagem em dias e horas. Calcule e informe a
        duração total da viagem em número de horas.
        Iepsen, Edécio Fernando. Lógica de Programação e
        Algoritmos com JavaScript - 2ª Edição: Uma
        introdução à programação de computadores com
        exemplos e exercícios para iniciantes (Portuguese
        Edition) (p. 50). Novatec Editora. Edição do Kindle.
      */

      const num_dias = Number(prompt('Informe o números de dias: '))
      const dias_horas = num_dias * 24
      const num_horas = Number(prompt('Digite o número de horas: '))
      const total_horas = dias_horas + num_horas

      alert(
        `Nº de dias: ${num_dias}\nNº de horas: ${num_horas}\nTotal de horas: ${total_horas}`
      )
    </script>
  </body>
</html>
