<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programa Para Cinema</title>
  </head>
  <body>
    <h1>Cine JS: Filmes em Cartaz</h1>
    <pre>
    a) Elaborar um programa para um Cinema, que leia 
    o título e a duração de um filme em minutos. 
    Exiba o título do filme e converta a duração para 
    horas e minutos.
    </pre>

    <form>
      <p>
        Título do filme:
        <input type="text" id="inTitulo" required />
      </p>
      <p>
        Duração (min):
        <input type="number" id="inDuracao" required />
      </p>
      <input type="submit" value="Converte em Horas e minutos" />

      <h3></h3>
      <h4></h4>

      <script src="prog_para_cinema.js"></script>
    </form>
  </body>
</html>
