<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzaria</title>
  </head>
  <body>
    <h1>Pizzaria</h1>
    <script>
      const valor_conta = Number(prompt('Digite o valor da conta R$ '))
      const num_clientes = Number(prompt('Digite o número de clienres: '))
      const valor_por_cliente = valor_conta / num_clientes

      alert(`Valor por cliente: R$ ${valor_por_cliente.toFixed(2)}`)
    </script>
  </body>
</html>
