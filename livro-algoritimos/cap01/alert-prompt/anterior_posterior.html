<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Número Anterior e Posterior</title>
  </head>
  <body>
    <h1>Número Anterior e Posterior</h1>
    <script>
      let numero = Number(prompt('Digite um número: '))
      let anterior = numero - 1
      let posterior = numero + 1

      alert(`Antes de ${numero} tem ${anterior} depois tem ${posterior}`)
    </script>
  </body>
</html>
