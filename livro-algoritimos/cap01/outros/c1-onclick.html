  <body>
    <h1>Evento Onclick</h1> 
    
    <h2>Botão Alert</h2>
    <button type='button' onclick="alert('Caixa de alerta.')">Alerta</button>

    <h2>Botão Confirm</h2>
    <button type='button' onclick="confirm('Caixa de confirmação.')">Conrirme</button>
    
    <h2>Botão Prompt</h2>
    <button type='button' onclick="prompt('Caixa de dados', 'Qualquer dado.')">Prompt</button>
