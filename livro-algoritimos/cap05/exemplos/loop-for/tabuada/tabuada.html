<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon -->
    <link
      rel="shortcut icon"
      href="/cap04/exemplos/img/livrojs.png"
      type="image/x-icon"
    />
    <title>Programa Tabuada JS</title>
    <link rel="stylesheet" href="/livro-algoritimos/css/style.css" />
  </head>

  <body>
    <div id="container">
      <h1>Programa Tabuada</h1>
      <pre>
    Nosso primeiro programa sobre repetições 
    deve ler um número e apresentar a tabuada 
    desse número.
      </pre>

      <h2>Tabuada JS</h2>

      <div id="questionario">
        <img
          id="inImagem"
          src="/livro-algoritimos/cap05/img/ex5_1.jpg"
          alt="Imagem da tabuada"
        />
        <form>
          <p>
            <label for="inNumero">Número:</label> <br />
            <input
              type="number"
              id="inNumero"
              name="numero"
              min="0"
              step="0.01"
              required
              autofocus
            />
          </p>

          <p>
            <input type="submit" id="btnPrincipal" value="Criar Tabuada" />
          </p>
        </form>
      </div>

      <div id="resposta">
        <h2 id="outResp1"></h2>
        <pre id="outResp2"></pre>
      </div>
    </div>

    <!-- Adiciona o JavaScript -->
    <script src="/livro-algoritimos/cap05/exemplos/loop-for/tabuada/tabuada.js"></script>
  </body>
</html>
