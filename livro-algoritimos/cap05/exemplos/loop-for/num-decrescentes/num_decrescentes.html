<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon -->
    <link
      rel="shortcut icon"
      href="/cap04/exemplos/img/livrojs.png"
      type="image/x-icon"
    />
    <title>Programa Números Decrescentes JS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div id="container">
      <h1>Programa Números Decrescentes JS</h1>
      <pre>
      O nosso segundo exemplo ilustra a montagem de uma 
      estrutura de repetição decrescente, com o valor 
      inicial informado pelo usuário.
      </pre>

      <h2>Números Decrescentes JS</h2>

      <div id="questionario">
        <img
          id="inImagem"
          src="/cap05/img/ex5_2.jpg"
          alt="Números decrescentes"
        />
        <form>
          <p>
            <label for="inNumero">Número:</label> <br />
            <input
              type="number"
              id="inNumero"
              name="numero"
              min="0"
              step="0.01"
              required
              autofocus
            />
          </p>

          <p>
            <input type="submit" id="btnPrincipal" value="Decrescer Até 1" />
          </p>
        </form>
      </div>

      <div id="resposta">
        <h2 id="outResp1"></h2>
        <h2 id="outResp2"></h2>
      </div>
    </div>

    <!-- Adiciona o JavaScript -->
    <script src="/cap05/exemplos/loop-for/num-decrescentes/num_decrescentes.js"></script>
  </body>
</html>
