<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/cap05/img/livrojs.png"
      type="image/x-icon"
    />
    <title>Fabrica de Estrela JS</title>
    <!-- Adiciona o CSS -->
    <link rel="stylesheet" href="/livro-algoritimos/css/style.css" />
    <style>
      img#inImagem {
        width: 130px;
        height: 100px;
        margin-top: 8px;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Programa Fabrica de Extrela JS</h1>
      <pre>
      questionário
      </pre>

      <h2>Fabrica de Estrela</h2>

      <div id="questionario">
        <img
          id="inImagem"
          src="/livro-algoritimos/cap05/img/ex5_7.jpg"
          alt="Aqui vai ter uma foto"
        />
        <form>
          <p>
            <label for="inNumero">Número de Estrelas:</label> <br />
            <input
              type="number"
              id="inNumero"
              name="inNumero"
              min="0"
              step="0.01"
              required
              autofocus
            />
          </p>
          <p>
            <input type="submit" value="Exibir Estrelas" />
          </p>
        </form>
      </div>

      <div id="resposta">
        <pre id="outResp1"></pre>
      </div>
    </div>
    <!-- Adiciona o JavaScript -->
    <script src="/livro-algoritimos/cap05/exemplos/fabrica-de-estrelas/fabrica_de_estrela.js"></script>
  </body>
</html>
